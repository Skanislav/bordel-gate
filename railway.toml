# Railway deployment for the bordel-auth Next.js app.
#
# Service settings to set in the Railway UI / CLI:
#
#   Root Directory:        web
#   Builder:               DOCKERFILE  (this file points at web/Dockerfile)
#
# Required env vars (Service → Variables):
#
#   NEXT_PUBLIC_WALLETCONNECT_PROJECT_ID  Reown Cloud project ID. Without it,
#                                         the page falls back to injected-only
#                                         wallets and shows the missing-config
#                                         banner. NEXT_PUBLIC_* vars are baked
#                                         into the bundle at BUILD time, so
#                                         this must be set before the deploy
#                                         that should pick it up.
#
# The app is fully client-side: the member tree lives in the browser's
# localStorage. There is no server-side database and nothing to persist.

[build]
builder = "DOCKERFILE"
dockerfilePath = "web/Dockerfile"

[deploy]
# Health check the home page; the app is fully usable as soon as the Next
# server is listening, no warm-up required.
healthcheckPath = "/"
healthcheckTimeout = 30
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 3
